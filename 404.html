<!doctype html>
<html lang="ko"><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>행사 레퍼런스 OS</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f7;
color:#1d1d1f;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.c{background:#fff;border-radius:18px;padding:28px 32px;margin:16px;max-width:380px;text-align:center;
box-shadow:0 2px 12px rgba(0,0,0,.06)}p{color:#6e6e73;font-size:14px;line-height:1.6}a{color:#0071e3}
</style>
<div class="c"><b>행사 레퍼런스 OS</b><p id="m">서버로 연결하는 중…</p></div>
<script>
var FALLBACK = "https://replace-dont-sizes-neural.trycloudflare.com";
var BASE = "/" + (location.pathname.split("/")[1] || "");
function go(u) {
  var rest = location.pathname.slice(BASE.length).replace(/^\/index\.html$/, "") || "/";
  location.replace(u.replace(/\/$/, "") + rest + location.search + location.hash);
}
fetch(BASE + "/url.json?t=" + Date.now(), {cache: "no-store"})
  .then(function (r) { return r.json(); })
  .then(function (j) { go(j.url || FALLBACK); })
  .catch(function () { go(FALLBACK); });
setTimeout(function () {
  document.getElementById("m").innerHTML = "연결되지 않으면 <a href='" + FALLBACK +
    "'>여기</a>를 누르세요.<br>서버가 다시 켜지는 중이면 1분 뒤 새로고침해 주세요.";
}, 4000);
</script>
</html>
